<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#050607" />
    <!-- Before the first paint: the theme (src/ui/theme/theme.ts explains) and whether this is Home (scripts/prerender.mjs).
         The script's hash is in public/_headers. -->
    <script>
      (function () {
        var choice;
        try {
          choice = localStorage.getItem("rebuffer-theme");
        } catch (error) {}
        var light =
          choice === "light" ||
          (choice !== "dark" && matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", light ? "#f4f5f6" : "#050607");
        // The page carries Home's markup; elsewhere it stays hidden until the app has drawn the screen.
        if (location.pathname !== "/") document.documentElement.dataset.notHome = "";
      })();
    </script>
    <title>Rebuffer: see how a video player survives a bad network</title>
    <meta
      name="description"
      content="Run a real HLS player through a simulated bad network in your browser. Watch its quality, buffer and stalls live, then read a scored report. No backend; nothing is uploaded."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
